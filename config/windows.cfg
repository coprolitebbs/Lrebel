corner_tr=32, 512, 32, 32
corner_bl=0, 544, 32, 32
corner_br=32, 544, 32, 32
edge_top=64, 512, 32, 8
edge_bottom=64, 520, 32, 8
edge_left=64, 528, 8, 32
edge_right=72, 528, 8, 32
center=64, 552, 32, 32

{hud_button_pressed}
