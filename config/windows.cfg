# Lrebel — описание элементов интерфейса на едином изображении img/windows.png.
# Формат значения: x, y, ширина, высота (в пикселях изображения).
# Секции: {skin} — файл изображения; {button} — кнопка в обычном состоянии;
# {button_pressed} — нажатая кнопка; {window} — типовое окно;
# {progressbar} — прогрессбар.

{skin}
image=img/windows.png

{button}
corner_tl=0, 0, 32, 32
corner_tr=32, 0, 32, 32
corner_bl=0, 32, 32, 32
corner_br=32, 32, 32, 32
edge_top=64, 0, 32, 8
edge_bottom=64, 8, 32, 8
edge_left=64, 16, 8, 32
edge_right=72, 16, 8, 32
center=64, 48, 32, 32

{button_pressed}
corner_tl=0, 96, 32, 32
corner_tr=32, 96, 32, 32
corner_bl=0, 128, 32, 32
corner_br=32, 128, 32, 32
edge_top=64, 96, 32, 8
edge_bottom=64, 104, 32, 8
edge_left=64, 112, 8, 32
edge_right=72, 112, 8, 32
center=64, 144, 32, 32

{window}
corner_tl=0, 192, 32, 32
corner_tr=32, 192, 32, 32
corner_bl=0, 224, 32, 32
corner_br=32, 224, 32, 32
edge_top=64, 192, 32, 8
edge_bottom=64, 200, 32, 8
edge_left=64, 208, 8, 32
edge_right=72, 208, 8, 32
center=64, 240, 32, 32
bg_pattern=128, 192, 64, 64

{progressbar}
start=0, 320, 32, 32
end=32, 320, 32, 32
fill=64, 320, 32, 32
background=96, 320, 32, 32
