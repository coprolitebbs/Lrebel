# Lrebel — настройки редактора карт (запуск игры с параметром "-ed").
# Формат такой же, как в config/main.cfg: секции {имя}, ключ=значение,
# комментарии с # или ;.

{editor}
# дефолтные размеры карты в элементах (максимум 1024x1024)
map_width=1024
map_height=1024
# сколько элементов карты помещается в окно по вертикали и горизонтали
# (по 16 во все стороны от камеры); под него пересчитывается размер
# одного тайла при загрузке игры
visible_elements=32
# скорость камеры, элементов карты в секунду (WASD, плавное перемещение)
camera_speed=8.0
# количество тайлов ассетов, отсчитываемых от первого тайла строки 22
# img/gtiles.png; новые ассеты добавляются в свободные места листа
asset_count=30

{objects}
# количество видов подбираемых/бросаемых объектов (оружие, боеприпасы,
# аптечка); тайлы отсчитываются от первого тайла строки 4 img/gtiles.png;
# их игровые описания лежат в config/objects.cfg
pickable_count=15

# три типа персонажей: строка тайлов в img/gtiles.png (колонки
# title_col..title_col+8: 8 направлений и труп), колонка первого тайла
# анимации title_col и флаг player — тип управляется игроком;
# первый тип должен иметь player=true

{char1}
tile_row=1
title_col=1
player=true

{char2}
tile_row=2
title_col=1
player=false

{char3}
tile_row=3
title_col=1
player=false
