# Lrebel — описания игровых объектов и персонажей.
# Загружается при старте игры (src/objects.c, src/main.c).
#
# Формат такой же, как в config/main.cfg: секции {имя}, ключ=значение,
# комментарии с # или ;. Кодировка файла — UTF-8; при загрузке строки
# перекодируются в Windows-1251 для шрифта.
#
# Секция {objectN} — подбираемый/бросаемый объект; N — с 1, без пропусков.
# N-я секция соответствует N-му тайлу строки 4 img/gtiles.png (тип объекта
# на карте: OBJ_TYPE_WEAPON_FIRST + N - 1):
#   колонки 1..10  — оружие,
#   колонка 11     — Боеприпас тяжелого оружия,
#   колонка 12     — Боеприпас легкого вооружения,
#   колонка 13     — Ракета,
#   колонка 14     — Сменный баллон (огнемет),
#   колонка 15     — Аптечка,
#   колонка 16     — Боеприпас для плазмомета.
#
# Поля:
#   name          — название;
#   desc1..desc3  — краткое описание, три строки;
#   type          — weapon (оружие) | ammo (боеприпас) | medkit (аптечка)
#                   | powerup (поверап иного типа);
#   max_count     — максимальное количество в наборе (оружие — 1,
#                   боеприпас — 20/30/1/100 по виду, аптечка/поверап — 1);
#   count         — реальное количество (по умолчанию равно max_count);
#   damage        — повреждение за 1 выстрел (только оружие);
#   reload_turns  — время перезарядки в ходах (только оружие);
#   magazine_size — размер магазина (только оружие);
#   weight        — вес одной единицы, кг (влияет на количество ходов
#                   персонажа в дальнейшем);
#   inv_size_x / inv_size_y — линейные размеры предмета в инвентаре в
#                   клетках сетки 15x15: горизонтальный и вертикальный
#                   размер;
#   inv_img_row / inv_img_col — ряд и колонка картинки предмета в
#                   инвентаре в img/hudimages.png (сетка 32x32, ряд 13 —
#                   полоса инвентарных картинок); картинка занимает
#                   inv_size_x x inv_size_y клеток;
#   hud_img_row / hud_img_col — ряд и колонка большого тайла предмета
#                   128x128 в img/hudimages.png (рисуется в окне
#                   инвентаря у выбранного оружия; тайлы нумеруются
#                   по строкам сверху вниз, 1 — левый верхний).
#
# Значения damage/reload_turns/magazine_size/weight — начальный баланс,
# их можно править без перекомпиляции.

